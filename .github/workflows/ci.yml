name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:9090
          NEXT_PUBLIC_ZITADEL_ISSUER: https://musekit-oua2yk.us1.zitadel.cloud
          NEXT_PUBLIC_ZITADEL_CLIENT_ID: placeholder-for-ci
        run: npm run build

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_ZITADEL_ISSUER=${{ secrets.NEXT_PUBLIC_ZITADEL_ISSUER }}
            NEXT_PUBLIC_ZITADEL_CLIENT_ID=${{ secrets.NEXT_PUBLIC_ZITADEL_CLIENT_ID }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/musekit-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/musekit-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
